# IMFD team standards — mechanical checks.
#
# Installed by the `setup-standards-lint` skill (team-standards plugin). The
# scripts live in .standards/ at the repo root.
#
# These hooks receive only the files a commit touches, so pre-existing
# violations in files nobody is editing never block a commit. Legacy code gets
# fixed when someone edits it -- use the `standards-audit` skill (dev-toolkit)
# to see the full picture deliberately instead.

repos:
  - repo: local
    hooks:
      - id: imfd-file-length
        name: file length (300 warn / 400 limit)
        entry: .standards/check_file_length.py
        language: script
        files: \.(py|js|jsx|ts|tsx|vue)$

      - id: imfd-comment-language
        name: comments and docstrings in English
        entry: .standards/check_comment_language.py
        language: script
        files: \.(py|js|jsx|ts|tsx|vue|sh|sql)$

